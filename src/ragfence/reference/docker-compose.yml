# Local development services for RAGFence.
# PostgreSQL 16 with pgvector for the authorization-aware reference implementation.
# Default DSN: postgresql+psycopg://ragfence:ragfence@localhost:5434/ragfence
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ragfence
      POSTGRES_PASSWORD: ragfence
      POSTGRES_DB: ragfence
    ports:
      - "${RAGFENCE_DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragfence -d ragfence"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ragfence_pgdata:/var/lib/postgresql/data

volumes:
  ragfence_pgdata:
