# Alembic configuration for RAGFence.
# DDL is Alembic-only: `create_all` is forbidden (see src/ragfence/db/base.py).
# The URL below is the local default; RAGFENCE_TEST_DATABASE_DSN (tests) and
# RAGFENCE_DATABASE_DSN (runtime) override it when set.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
sqlalchemy.url = postgresql+psycopg://ragfence:ragfence@localhost:5432/ragfence

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
