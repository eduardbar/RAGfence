name: Publish Docker image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish container image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve pinned package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            echo "RAGFENCE_SPEC=ragfence==${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          else
            echo "RAGFENCE_SPEC=ragfence>=0.1,<3" >> "$GITHUB_ENV"
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            RAGFENCE_SPEC=${{ env.RAGFENCE_SPEC }}
          tags: |
            ghcr.io/eduardbar/ragfence:${{ github.event.release.tag_name || github.ref_name }}
            ghcr.io/eduardbar/ragfence:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
